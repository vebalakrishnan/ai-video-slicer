# frontend/nginx.conf
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Matches MAX_UPLOAD_BYTES in backend/app/routers/videos.py (500 MB) -
    # nginx's own default (1m) otherwise rejects any real video upload
    # with 413 before the request ever reaches the backend's own check.
    client_max_body_size 500M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A large upload (up to the 500 MB client_max_body_size above) can
        # take well over nginx's default 60s on a slow connection.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Traefik (production) sets this to https; forwarded as-is so
        # uvicorn's --proxy-headers builds https:// redirect/absolute
        # URLs instead of defaulting to the http scheme of this
        # container-internal hop. Empty/unset in local dev (no proxy in
        # front), so uvicorn falls back to the real connection scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
